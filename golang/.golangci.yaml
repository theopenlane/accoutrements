version: "2"
run:
  modules-download-mode: readonly
  tests: false
  allow-parallel-runners: true
linters:
  enable:
    - bodyclose
    - err113
    - gocritic
    - gosec
    - misspell
    - mnd
    - noctx
    - revive
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - comments # undisable this after fixing all comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal/graphapi/testclient
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - internal/graphapi/generated/gen_models.go
      - internal/graphapi/historygenerated/gen_models.go
      - internal/testutils/*
      - pkg/entitlements/test/*
      - cli/cmd/*
      - internal/ent/hush/examples/*
      - internal/workflows/examples/*
      - internal/ent/csvgenerated/*
      - internal/ent/workflowgenerated/*
      - internal/httpserve/specs/*
