steps:
  - group: ":golang: Builds"
    key: "go-builds"
    steps:
      - label: ":golang: build"
        key: "gobuild-server"
        cancel_on_build_failing: true
        artifact_paths: "bin/${APP_NAME}"
        plugins:
          - docker#v5.14.0:
              image: "golang:1.27-alpine"
              always_pull: true
              environment:
                - CGO_ENABLED=0
                - GOOS=linux
              command: ["go", "tool", "task", "go:build:ci"]
      - label: ":terminal: build cli"
        key: "gobuild-cli"
        agents:
          queue: "hosted-small"
        cancel_on_build_failing: true
        artifact_paths: "bin/openlane-cli"
        plugins:
          - docker#v5.14.0:
              image: "golang:1.27-alpine"
              always_pull: true
              environment:
                - GOOS=darwin
                - GOARCH=arm64
              command: ["go", "tool", "task", "go:build-cli:ci"]
