steps:
  - group: ":database: atlas migrate"
    key: "database"
    steps:
      - label: ":postgres: atlas lint"
        key: "atlas_lint"
        agents:
          queue: "hosted-small"
        plugins:
          - theopenlane/atlas#v1.2.1:
              project: openlane
              atlas-env: dev
              config: "file://db/atlas.hcl"
              dir: "file://db/migrations"
              step: lint
      - label: ":rocket: atlas push"
        if: build.branch == "main"
        key: "atlas_migrate"
        agents:
          queue: "hosted-small"
        plugins:
          - theopenlane/atlas#v1.2.1:
              project: openlane
              dir: "file://db/migrations"
              step: migrate
              atlas-env: dev
              config: "file://db/atlas.hcl"
